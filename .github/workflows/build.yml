name: Build downloads

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-arm64
          - os: windows-2022
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Prepare build tools and pinned OBS
        run: |
          python chat_plugin/tests/package_source_tests.py
          python -m pip install cmake==3.31.6 ninja==1.13.0
          python chat_plugin/scripts/prepare-ci.py ${{ matrix.platform }}
      - name: Prepare Chromium fixture
        run: |
          npm ci --prefix chat_plugin/tests/browser --ignore-scripts
          node chat_plugin/tests/browser/node_modules/playwright/cli.js install chromium
      - name: Build and test Mac package
        if: runner.os == 'macOS'
        run: |
          zsh chat_plugin/scripts/build-mac.sh
          PLAYWRIGHT_MODULE="$PWD/chat_plugin/tests/browser/node_modules/playwright" node chat_plugin/tests/inline_chat_browser.cjs .phase0/chat/build/awl-chat-inline-tests
      - name: Build and test Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PYTHON = (Get-Command python).Source
          & chat_plugin/scripts/build-windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          $env:PATH = "$PWD\.phase0\chat\deps-win\qt\bin;$PWD\.phase0\chat\deps-win\bin;$env:PATH"
          $env:QT_PLUGIN_PATH = "$PWD\.phase0\chat\deps-win\qt\plugins"
          $env:PLAYWRIGHT_MODULE = "$PWD\chat_plugin\tests\browser\node_modules\playwright"
          node chat_plugin/tests/inline_chat_browser.cjs .phase0/chat/build-win/awl-chat-inline-tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Browser fixture failed' }
          & chat_plugin/tests/installer_windows.ps1
      - name: Wrap downloads and record SHA-256
        run: python chat_plugin/scripts/distribute.py ${{ matrix.platform }}
      - name: Attest downloads against this workflow and commit
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: '.phase0/release/${{ matrix.platform }}/*'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: download-${{ matrix.platform }}
          path: .phase0/release/${{ matrix.platform }}/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Preserve test diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-${{ matrix.platform }}
          path: .phase0/chat/build*/Testing/Temporary/*.log
          if-no-files-found: ignore

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: download-*
          path: downloads
          merge-multiple: true
      - name: Check both platforms and create a draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat downloads/SHA256SUMS-*.txt > downloads/SHA256SUMS.txt
          (cd downloads && sha256sum --check SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" downloads/* --verify-tag --draft --prerelease \
            --title "Interpretwitch $RELEASE_TAG — preview" --notes-file RELEASE_NOTES.md
